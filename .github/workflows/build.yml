name: Build

# - Chaque push / pull request : compile ToolBox.exe (téléchargeable dans l'onglet Actions).
# - Tag vX.Y.Z, ou « Run workflow » avec un numéro de version : compile ET publie une Release.
#   Les ToolBox déjà installés la détectent et se mettent à jour tout seuls.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (ex. 0.2.0). Vide = compiler seulement.'
        required: false
        default: ''

permissions:
  contents: write

# Un nouveau push annule la compilation précédente de la même branche (inutile de finir l'ancienne).
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  # Version figée de vcpkg (gestionnaire de bibliothèques C++) : même Tesseract à chaque compilation.
  VCPKG_TAG: '2026.07.29'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Déterminer la version
        id: ver
        shell: pwsh
        run: |
          $release = $false
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.Substring(1); $release = $true
          } elseif ('${{ github.event.inputs.version }}' -ne '') {
            $v = '${{ github.event.inputs.version }}'.TrimStart('v'); $release = $true
          } else {
            $v = (Select-String -Path CMakeLists.txt -Pattern 'set\(TOOLBOX_VERSION "([0-9.]+)"').Matches[0].Groups[1].Value
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version invalide : $v (format attendu : 1.2.3)" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Version : $v (release : $release)"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Tesseract déjà compilé, gardé en cache : il n'est recompilé que si vcpkg.json,
      # le triplet ou VCPKG_TAG changent (et pas à chaque mise à jour de Visual Studio).
      - name: Restaurer Tesseract (déjà compilé)
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg_installed
          key: vcpkg-installed-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}

      - name: Installer vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:VCPKG_TAG https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          if ('${{ steps.vcpkg-cache.outputs.cache-hit }}' -ne 'true') {
            & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          }
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV

      - name: Cache WebView2 et json
        uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-webview2-1.0.4258.31-json-3.11.3

      - name: Configurer
        shell: pwsh
        run: |
          $cmakeArgs = @('-S', '.', '-B', 'build', '-G', 'Ninja', '-DCMAKE_BUILD_TYPE=Release',
                    "-DTOOLBOX_VERSION=${{ steps.ver.outputs.version }}",
                    "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake",
                    "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/vcpkg_installed")
          # Cache trouvé : on utilise Tesseract tel quel, sans rien recompiler.
          if ('${{ steps.vcpkg-cache.outputs.cache-hit }}' -eq 'true') { $cmakeArgs += '-DVCPKG_MANIFEST_INSTALL=OFF' }
          cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enregistrer Tesseract dans le cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg_installed
          key: vcpkg-installed-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}

      - name: Compiler
        run: cmake --build build --config Release

      - name: Diagnostic (en cas d'échec)
        if: failure()
        shell: pwsh
        run: |
          Get-Content build/generated/toolbox.rc -ErrorAction SilentlyContinue | Select-Object -First 12
          Get-Content build/vcpkg-manifest-install.log -ErrorAction SilentlyContinue | Select-Object -Last 60
          Get-ChildItem "$env:VCPKG_ROOT/buildtrees" -Recurse -Filter "*-err.log" -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Tail 40 }

      - name: Préparer les fichiers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/ToolBox.exe dist/ToolBox.exe
          $hash = (Get-FileHash dist/ToolBox.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist/ToolBox.exe.sha256", "$hash  ToolBox.exe`n")
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ToolBox-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Publier la Release
        if: steps.ver.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/ToolBox.exe dist/ToolBox.exe.sha256 --clobber
          } else {
            gh release create $tag dist/ToolBox.exe dist/ToolBox.exe.sha256 --title "ToolBox $tag" --generate-notes --target $env:GITHUB_SHA
          }
