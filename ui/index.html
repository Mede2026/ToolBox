<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToolBox</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect x="3" y="9" width="26" height="18" rx="4" fill="currentColor" opacity=".18"/><path d="M11 9V7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2M3 16h26M13 16v3h6v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="9" width="26" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </div>
      <div>
        <div class="brand-name">ToolBox</div>
        <div class="brand-version" id="brand-version">—</div>
      </div>
    </div>
    <div class="nav-search">
      <svg class="icon" viewBox="0 0 24 24"><path d="M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13zM20 20l-4.8-4.8"/></svg>
      <input type="search" id="nav-search" placeholder="Rechercher une fonction" autocomplete="off">
    </div>
    <nav id="nav"></nav>
    <label class="global-toggle">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v8M7.5 6.3a7 7 0 1 0 9 0"/></svg>
      <span id="global-label">Activé</span>
      <input type="checkbox" class="switch" id="global-switch">
    </label>
  </aside>

  <main id="main">
    <div id="page"></div>
  </main>

  <div id="toast" class="toast" hidden></div>
  <dialog id="dialog"></dialog>

  <script src="app.js"></script>
</body>
</html>
